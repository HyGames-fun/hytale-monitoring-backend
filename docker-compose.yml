services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hytale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Microservice 1: Catalog API
  catalog:
    build: .
    restart: unless-stopped
    command: ["/app/catalog"]
    environment:
      PORT: "4242"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/hytale?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "super-secret-jwt-key-2026"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Microservice 2: Auth Service
  auth:
    build: .
    restart: unless-stopped
    command: ["/app/auth"]
    environment:
      AUTH_PORT: "4243"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/hytale?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "super-secret-jwt-key-2026"
      COOKIE_DOMAIN: "localhost"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Microservice 3: Background Metrics Collector & gRPC Telemetry
  collector:
    build: .
    restart: unless-stopped
    command: ["/app/collector"]
    ports:
      - "50051:50051" # gRPC port for Hytale server mods
    environment:
      GRPC_PORT: "50051"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/hytale?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # API Gateway: Nginx reverse proxy
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "4242:4242" # Single unified entrypoint for clients
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalog
      - auth

volumes:
  postgres_data:
  redis_data:
